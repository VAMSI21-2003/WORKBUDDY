# WorkBuddy on one Ubuntu VM: the app, and Caddy in front for automatic HTTPS.
# Run it through ./compose.sh (it adds the settings files); release it with ./release.sh <commit>.
# Nothing here is a secret: the Google client secret, the operator token and the key come from .env,
# which only the VM holds.
name: workbuddy

services:
  app:
    image: "workbuddy:${WORKBUDDY_TAG:?no release yet, run ./release.sh with a commit}"
    restart: unless-stopped
    env_file: .env
    environment:
      # The one proxy in front of the app is Caddy (see the Caddyfile). 0 would put every visitor
      # in one rate-limit bucket (Caddy's address); 2 or more would let a caller pick their own.
      WORKBUDDY_TRUSTED_PROXY_HOPS: "1"
      WORKBUDDY_PUBLIC_ORIGIN: "https://${WORKBUDDY_DOMAIN:?set WORKBUDDY_DOMAIN in .env}"
      # Sign in with Google (docs/deploy.md, Section 7, step 6). The redirect address that is
      # registered with Google is WORKBUDDY_PUBLIC_ORIGIN + /auth/google/callback.
      WORKBUDDY_GOOGLE_CLIENT_ID: "${WORKBUDDY_GOOGLE_CLIENT_ID:?set WORKBUDDY_GOOGLE_CLIENT_ID in .env}"
      WORKBUDDY_GOOGLE_CLIENT_SECRET: "${WORKBUDDY_GOOGLE_CLIENT_SECRET:?set WORKBUDDY_GOOGLE_CLIENT_SECRET in .env}"
      # For scripts and smoke.sh; it reaches only the sessions it creates.
      WORKBUDDY_OPERATOR_TOKEN: "${WORKBUDDY_OPERATOR_TOKEN:?set WORKBUDDY_OPERATOR_TOKEN in .env}"
      # Empty: any verified Google email may sign in.
      WORKBUDDY_ALLOWED_EMAILS: "${WORKBUDDY_ALLOWED_EMAILS:-}"
      # The reply writer's key (Gemini). Optional: empty, Groq (GROQ_API_KEY) writes the replies
      # too. With both, each model stands in for the other when it can't answer.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      # The Gemini model; empty is gemini-2.5-flash.
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
    # No "ports": the app can't be reached from outside this machine, only through Caddy.
    expose:
      - "8000"
    volumes:
      # Sessions, uploads and delivered files. A named volume keeps them across releases and
      # carries the image's ownership (user 10001) with it.
      - workbuddy-data:/data
    # 2 GB, not 1: the server idles at about 580 MB after a large turn (memory it takes isn't
    # given back), two turns may run at once (WORKBUDDY_MAX_CONCURRENT_TURNS), and the workbook
    # check's child may take up to 512 MB more. Fits a 4 GB VM with Caddy's 256 MB and the OS.
    mem_limit: 2g
    logging: &log-rotation
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # The image's own HEALTHCHECK (/healthz) tells Docker whether it's up; Caddy waits for it.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      WORKBUDDY_DOMAIN: "${WORKBUDDY_DOMAIN:?set WORKBUDDY_DOMAIN in .env}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificate and its account: keep them, or every restart asks Let's Encrypt again.
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    logging: *log-rotation

volumes:
  workbuddy-data:
    name: workbuddy-data
  caddy-data:
    name: workbuddy-caddy-data
  caddy-config:
    name: workbuddy-caddy-config
